<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5">School Management System</h1>

        <!-- Add School Form -->
        <div class="card mt-4">
            <div class="card-body">
                <h4 class="card-title">Add School</h4>
                <form id="schoolForm">
                    <div class="mb-3">
                        <label for="schoolName" class="form-label">School Name</label>
                        <input type="text" id="schoolName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="schoolAddress" class="form-label">Address</label>
                        <input type="text" id="schoolAddress" class="form-control"  required>
                    </div>
                    <div class="mb-3">
                        <label for="latitude" class="form-label">Latitude</label>
                        <input type="number" id="latitude" class="form-control" step="0.000001"required>
                    </div>
                    <div class="mb-3">
                        <label for="longitude" class="form-label">Longitude</label>
                        <input type="number" id="longitude" class="form-control" step="0.000001"required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add School</button>
                </form>
            </div>
        </div>

        <div class="mt-3 text-center">
            <button onclick="window.location.href='schools.html'" class="btn btn-secondary">
              View Schools
            </button>
          </div>
        </div>

    <script src="script.js"></script>
</body>
</html>

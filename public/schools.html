<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Schools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5">List of Schools</h1>

        <!-- Schools List Table -->
        <div class="card mt-4">
            <div class="card-body">
                <h4 class="card-title">Schools</h4>
                <table class="table table-bordered" id="schoolsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Address</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Distance (km)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Schools will be listed here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="schools.js"></script>
</body>
</html>
